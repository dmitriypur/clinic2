    :root {
      color-scheme: light;
      --navy: #1f3462;
      --orange: #f5841f;
      --muted: #566783;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: #f6f7f9;
      color: var(--navy);
      font-family: Gilroy, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .container { width: min(1200px, calc(100% - 64px)); margin-inline: auto; }
    .header { background: #fff; border-bottom: 1px solid #e5e7eb; }
    .header-inner {
      min-height: 112px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }
    .logo { display: block; width: 280px; max-width: 100%; height: auto; }
    .domain { font-size: 16px; font-weight: 600; letter-spacing: .02em; }
    main { flex: 1; display: flex; align-items: center; padding-block: 64px; }
    .notice {
      width: 100%;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      align-items: center;
      gap: 36px;
      overflow: hidden;
      padding: 64px;
      border-radius: 32px;
      background: #fff;
    }
    h1 { margin: 0; font-size: clamp(36px, 4.5vw, 58px); line-height: 1.08; font-weight: 600; letter-spacing: -.035em; }
    .description { max-width: 440px; margin: 24px 0 0; color: var(--muted); font-size: 19px; line-height: 1.55; }
    .phone { color: var(--navy); font-weight: 600; white-space: nowrap; text-underline-offset: 4px; }
    .phone:focus-visible { outline: 3px solid var(--navy); outline-offset: 5px; }
    .phone-list { padding: 0; list-style: none; }
    .illustration { display: block; width: 100%; max-width: 420px; height: auto; margin-inline: auto; }
    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px 24px;
      padding-block: 24px 32px;
      border-top: 1px solid #dce1e9;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .footer-inner p { margin: 0; }
    @media (max-width: 900px) {
      .notice { padding: 40px; gap: 24px; }
      h1 { font-size: 44px; }
      .description { font-size: 18px; }
    }
    @media (max-width: 680px) {
      .container { width: calc(100% - 32px); }
      .header-inner { min-height: 88px; }
      .logo { width: 245px; }
      .domain { display: none; }
      main { padding-block: 24px; }
      .notice { grid-template-columns: 1fr; gap: 24px; padding: 32px 24px; border-radius: 24px; }
      h1 { font-size: clamp(32px, 8.5vw, 44px); }
      .description { margin-top: 20px; font-size: 17px; }
      .illustration { max-width: 230px; }
      .footer-inner { padding-block: 20px 24px; font-size: 13px; }
    }
  </style>
