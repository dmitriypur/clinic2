              - paragraph [ref=e623]: Наблюдаемся более 2 лет. Дочке 10 лет, ухудшилось зрение. Обратились в клинику "Мама, я вижу". Анастасия Дмитриевна подобрала линзы, сначала дневные, после и ночные. Зрение улучшилось. Дочка занимается чир спортом. Днем ходит без очков. Ночью лечебные линзы. Постоянное наблюдение. За год зрение значительно улучшилось. Отличная современная аппаратура в клинике. Рекомендую врача знакомым. Сама, по рекомендации Анастасии Дмитриевны, ношу очки прогрессивные, тонированные. Очень удобны на работе, за рулем, в солнечную погоду. Я привела маму, 75 лет, на прием. Осложнения после операции на глаз. Внимательное обследование. Получила квалифицированную помощь, лечение, купила очки по доступной цене. Прием всегда радушный. Классный специалист. Знающий свое дело врач. Лечение помогает. Анастасия Дмитриевна - чудесный, опытный, прекрасный, ответственный врач. Я, мама, дети очень любим приходить на прием к врачу.
