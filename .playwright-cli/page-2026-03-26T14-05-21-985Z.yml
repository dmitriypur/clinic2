              - paragraph [ref=e589]: Были на приеме с дочкой, 4 года. В городской поликлинике поставили возможную дальнозоркость, ношение очков. Пришли подтвердить или опровергнуть диагноз. Врач внимательно провела диагностику зрения, потом закапала капли и сказала, что все в пределах нормы. На наши опасения по поводу предыдущего осмотра предложила закапать еще раз для еще большей точности. Повторный осмотр показал снова норму. Доктор все объяснила, дала рекомендации по поводу капель в случае воспаления глаза, которое у нас было на фоне заложенности носа, и мы счастливые ушли домой.
